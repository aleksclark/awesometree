syntax = "proto3";
package arp.v1;

option go_package = "github.com/aleksclark/spec-torture/gen/arp/v1;arpv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// NOTE: WorkspaceService RPCs (workspace-as-episode CRUD) were removed.
// Use WorkSessionService in work_session.proto for AWM WorkSessions.
// A minimal Workspace message remains for discovery event payloads until
// those streams are renamed; it is not the AWM material Workspace Resource alone.
// AgentInstance remains here to avoid circular imports with agent.proto.

message Workspace {
  // work_session_id (legacy field name "name" kept for wire stability).
  string name = 1;
  string project = 2;
  string dir = 3;
  WorkspaceStatus status = 4;
  repeated AgentInstance agents = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Struct metadata = 7;
}

enum WorkspaceStatus {
  WORKSPACE_STATUS_UNSPECIFIED = 0;
  WORKSPACE_STATUS_ACTIVE = 1;
  WORKSPACE_STATUS_INACTIVE = 2;
}

// AgentInstance represents a running (or recently stopped) agent.
message AgentInstance {
  string id = 1;
  string template = 2;
  // work_session_id the agent belongs to (field name retained for wire stability).
  string workspace = 3;
  AgentStatus status = 4;
  int32 port = 5;
  string direct_url = 6;
  string proxy_url = 7;
  int32 pid = 8;
  string context_id = 9;
  google.protobuf.Struct a2a_agent_card = 10;
  string token_id = 11;
  string session_id = 12;
  string spawned_by = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Struct metadata = 15;
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_STARTING = 1;
  AGENT_STATUS_READY = 2;
  AGENT_STATUS_BUSY = 3;
  AGENT_STATUS_ERROR = 4;
  AGENT_STATUS_STOPPING = 5;
  AGENT_STATUS_STOPPED = 6;
}
